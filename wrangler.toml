name = "render-ping-worker"
main = "src/index.js"
compatibility_date = "2025-06-10"

[triggers]
# Run every 10 minutes, 24/7.
# Render's free tier puts web services to sleep after 15 minutes of inactivity.
# Running every 10 minutes (*/10 * * * *) provides a 5-minute safety margin against
# Cloudflare scheduled execution jitter, network latency, and retries.
# 144 executions/day is well within Cloudflare's 100,000 requests/day free tier.
crons = ["*/10 * * * *"]

[observability.logs]
enabled = true

[vars]
# Target Render service (can be overridden via Cloudflare Dashboard secrets/variables)
RENDER_APP_URL = "https://songless-unlimited.onrender.com"
HEALTH_ENDPOINT = "/healthz"
FALLBACK_ENDPOINT = "/"
TIMEOUT_MS = "30000"
RETRY_ATTEMPTS = "2"
ENABLE_FALLBACK = "true"
